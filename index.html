    <script>
        const playerNameInput = document.getElementById('playerName');
        const drawPackButton = document.getElementById('drawPackButton');
        const showEncyclopediaButton = document.getElementById('showEncyclopediaButton');
        const backToPackButton = document.getElementById('backToPackButton');
        const clearEncyclopediaButton = document.getElementById('clearEncyclopediaButton');
        const changeNameButton = document.getElementById('changeNameButton');
        const currentUserNameDisplay = document.getElementById('currentUserName');

        const cardPack = document.getElementById('cardPack');
        const packTop = cardPack.querySelector('.pack-top');
        const packBody = cardPack.querySelector('.pack-body');
        const packOpenText = document.getElementById('packOpenText');
        const cardDisplayArea = document.getElementById('cardDisplayArea');
        const encyclopediaArea = document.getElementById('encyclopediaArea');
        const deckSelectionArea = document.getElementById('deckSelectionArea');
        const deckDisplayArea = document.getElementById('deckDisplayArea');
        const encyclopediaContent = document.getElementById('encyclopediaContent');
        const rarityTabsContainer = document.querySelector('.rarity-tabs');
        const packCardDisplayWrapper = document.querySelector('.pack-card-display-wrapper');

        const toggleDeckSelectionButton = document.getElementById('toggleDeckSelectionButton');

        let collectedCards = [];
        let selectedDeck = [];

        // Initialize Sortable for the deckDisplayArea
        let sortableDeck = null; // Declare it globally or in a scope accessible by initSortable

        function initSortable() {
            if (sortableDeck) {
                sortableDeck.destroy(); // Destroy previous instance if it exists
            }
            sortableDeck = new Sortable(deckDisplayArea, {
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: function (evt) {
                    // Update the selectedDeck array based on the new order
                    const [removed] = selectedDeck.splice(evt.oldIndex, 1);
                    selectedDeck.splice(evt.newIndex, 0, removed);
                    saveCards(); // Save the new order to localStorage
                    // No need to call renderDeckDisplay here, SortableJS handles DOM movement
                }
            });
        }

        // Function to save collected cards and deck to localStorage
        function saveCards() {
            localStorage.setItem('collectedCards', JSON.stringify(collectedCards));
            localStorage.setItem('selectedDeck', JSON.stringify(selectedDeck));
        }

        // Function to load collected cards and deck from localStorage
        function loadCards() {
            const savedCards = localStorage.getItem('collectedCards');
            if (savedCards) {
                collectedCards = JSON.parse(savedCards);
            }
            else {
                collectedCards = [];
            }

            const savedDeck = localStorage.getItem('selectedDeck');
            if (savedDeck) {
                selectedDeck = JSON.parse(savedDeck);
            }
            else {
                selectedDeck = [];
            }

            // Load player name from localStorage or set default
            let savedPlayerName = localStorage.getItem('playerName');
            if (savedPlayerName) {
                playerNameInput.value = savedPlayerName;
                currentUserNameDisplay.textContent = savedPlayerName;
            }
            else {
                playerNameInput.value = 'プレイヤー1';
                currentUserNameDisplay.textContent = 'プレイヤー1';
            }
        }

        // Load cards and player name on script initialization
        loadCards();

        // Seeded Random Number Generator for consistent results
        function mulberry32(seed) {
            return function() {
                seed |= 0;
                seed = (seed + 0x6D2B79F5) | 0;
                let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 13), 1 | t)) | 0;
                return (t >>> 0) / 0x100000000; // Corrected: Normalize to [0, 1) using full 32-bit value
            };
        }

        // Simple string hash function to generate a seed
        function stringToSeed(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            return hash;
        }

        function generateCardData(playerName, cardIndex, seed) {
            const rng = mulberry32(seed);
            const rawRngValues = {};

            let rarity;

            let val1 = rng(); rawRngValues.val1 = val1;
            let val2 = rng(); rawRngValues.val2 = val2;
            let val3 = rng(); rawRngValues.val3 = val3;
            let val4 = rng(); rawRngValues.val4 = val4;
            let val5 = rng(); rawRngValues.val5 = val5;
            let val6 = rng(); rawRngValues.val6 = val6;
            let val7 = rng(); rawRngValues.val7 = val7;

            if (val1 < 0.6) {
                let sumRng = (val2 + val3 + val4 + val5 + val6) / 5;
                rarity = Math.floor(sumRng * 400) + 100;
            } else {
                rarity = Math.floor(val7 * 999) + 1;
            }

            rarity = Math.max(1, Math.min(999, rarity));

            // Calculate stats based on rarity and add some randomness
            // Attack: 1-50
            const baseAttack = 1 + (rarity / 999) * 49; // Scale from 1 to 50
            const attack = Math.max(1, Math.min(50, Math.floor(baseAttack + (rng() * 10 - 5)))); // Add random variation of +/- 5

            // Defense: 1-10
            const baseDefense = 1 + (rarity / 999) * 9; // Scale from 1 to 10
            const defense = Math.max(1, Math.min(10, Math.floor(baseDefense + (rng() * 4 - 2)))); // Add random variation of +/- 2

            // HP: 10-300
            const baseHP = 10 + (rarity / 999) * 290; // Scale from 10 to 300
            const hp = Math.max(10, Math.min(300, Math.floor(baseHP + (rng() * 40 - 20)))); // Add random variation of +/- 20

            // Speed remains completely random
            const rngSpeed = rng(); rawRngValues.rngSpeed = rngSpeed; // Keep this for raw RNG value tracking if needed
            const speed = Math.floor(rngSpeed * 100) + 1; // 1-100

            const traitTypes = ['氷', '回復', '火', 'パワー倍増', '高速', 'キャプテン', '爆発'];
            const rngTraitChance = rng(); rawRngValues.rngTraitChance = rngTraitChance;
            let trait = null;
            if (rngTraitChance < 0.15) {
                const rngTraitIndex = rng(); rawRngValues.rngTraitIndex = rngTraitIndex;
                trait = traitTypes[Math.floor(rngTraitIndex * traitTypes.length)];
            }

            let rarityClass;
            let effectClasses = '';

            if (rarity <= 50) { rarityClass = 'rarity-1-50'; }
            else if (rarity <= 100) { rarityClass = 'rarity-51-100'; }
            else if (rarity <= 150) { rarityClass = 'rarity-101-150'; }
            else if (rarity <= 200) { rarityClass = 'rarity-151-200'; }
            else if (rarity <= 250) { rarityClass = 'rarity-201-250'; }
            else if (rarity <= 300) { rarityClass = 'rarity-251-300'; }
            else if (rarity <= 350) { rarityClass = 'rarity-301-350'; }
            else if (rarity <= 400) { rarityClass = 'rarity-351-400'; }
            else if (rarity <= 450) { rarityClass = 'rarity-401-450'; }
            else if (rarity <= 500) { rarityClass = 'rarity-451-500'; }
            else if (rarity <= 550) { rarityClass = 'rarity-501-550'; }
            else if (rarity <= 600) { rarityClass = 'rarity-551-600'; }
            else if (rarity <= 650) { rarityClass = 'rarity-601-650'; }
            else if (rarity <= 700) { rarityClass = 'rarity-651-700'; }
            else if (rarity <= 750) { rarityClass = 'rarity-701-750'; }
            else if (rarity <= 800) { rarityClass = 'rarity-751-800'; }
            else if (rarity <= 850) { rarityClass = 'rarity-801-850'; }
            else if (rarity <= 900) { rarityClass = 'rarity-851-900'; }
            else if (rarity <= 950) { rarityClass = 'rarity-901-950'; }
            else { rarityClass = 'rarity-951-999'; }

            if (rarity >= 300) { effectClasses = 'has-shine'; }
            if (rarity >= 851) { effectClasses += ' has-holographic'; }

            const cardIdentifier = JSON.stringify({
                playerName: playerName,
                rarity: rarity,
                stats: { attack, defense, hp, speed },
                trait: trait
            });

            return {
                id: stringToSeed(cardIdentifier),
                playerName: playerName,
                rarity: rarity,
                rarityClass: rarityClass,
                effectClasses: effectClasses,
                stats: { attack, defense, hp, speed },
                trait: trait,
                rawRngValues: rawRngValues,
                isNew: true
            };
        }

        function createCardElement(cardData, delay, isDeckCard = false) {
            const cardDiv = document.createElement('div');
            cardDiv.className = `card ${cardData.rarityClass} ${cardData.effectClasses}`;
            if (isDeckCard) {
                cardDiv.classList.add('card-in-deck');
                cardDiv.dataset.cardId = cardData.id; // Add data attribute for SortableJS
            } else if (delay !== undefined) {
                cardDiv.style.animationDelay = `${delay}s`;
            }

            let newMarkHtml = '';
            if (cardData.isNew && !isDeckCard) {
                newMarkHtml = '<div class="new-mark">NEW</div>';
            }

            // Always include rarity for deck cards in a simplified format
            const rarityHtml = isDeckCard ? `<div class="card-rarity">R:${cardData.rarity}</div>` : `<div class="card-rarity">レアリティ: ${cardData.rarity}</div>`;
            // Always include trait if it exists
            const traitHtml = cardData.trait ? `<div class="card-trait">${cardData.trait}</div>` : '';
            // Always include stats
            const statsHtml = `<div class="card-stats">
                                <div>攻撃: ${cardData.stats.attack}</div>
                                <div>防御: ${cardData.stats.defense}</div>
                                <div>HP: ${cardData.stats.hp}</div>
                                <div>素早さ: ${cardData.stats.speed}</div>
                            </div>`;

            cardDiv.innerHTML = `
                ${newMarkHtml}
                <div class="card-header-frame">
                    <div class="card-name">${cardData.playerName}</div>
                </div>
                <div class="card-content">
                    ${rarityHtml}
                    ${statsHtml}
                    ${traitHtml}
                </div>
            `;

            // Attach double-click listener based on context
            cardDiv.addEventListener('dblclick', () => {
                handleCardDoubleClick(cardData, isDeckCard);
            });

            return cardDiv;
        }

        // Helper to get rarity group name based on rarity score
        function getRarityGroupName(rarity) {
            if (rarity <= 50) return 'コモン (1-50)';
            else if (rarity <= 100) return 'コモン+ (51-100)';
            else if (rarity <= 150) return 'アンコモン (101-150)';
            else if (rarity <= 200) return 'アンコモン+ (151-200)';
            else if (rarity <= 250) return 'レア (201-250)';
            else if (rarity <= 300) return 'レア+ (251-300)';
            else if (rarity <= 350) return 'スーパーレア (301-350)';
            else if (rarity <= 400) return 'スーパーレア+ (351-400)';
            else if (rarity <= 450) return 'エピック (401-450)';
            else if (rarity <= 500) return 'エピック+ (451-500)';
            else if (rarity <= 550) return 'レジェンダリー (501-550)';
            else if (rarity <= 600) return 'レジェンダリー+ (551-600)';
            else if (rarity <= 650) return 'ミシック (601-650)';
            else if (rarity <= 700) return 'ミシック+ (651-700)';
            else if (rarity <= 750) return 'セレスティアル (701-750)';
            else if (rarity <= 800) return 'セレスティアル+ (751-800)';
            else if (rarity <= 850) return 'アルティメット (801-850)';
            else if (rarity <= 900) return 'アルティメット+ (851-900)';
            else if (rarity <= 950) return 'トランセンデント (901-950)';
            else return 'スプリーム (951-999)';
        }

        function handleCardDoubleClick(cardData, isDeckCard) {
            if (isDeckCard) {
                // Card in deck was double-clicked, remove it
                selectedDeck = selectedDeck.filter(card => card.id !== cardData.id);
                alert(`${cardData.playerName} (レアリティ: ${cardData.rarity}) がデッキから削除されました。`);
            } else {
                // Card in encyclopedia was double-clicked, add to deck
                if (selectedDeck.length < 5) {
                    // Check if card is already in deck
                    if (!selectedDeck.some(card => card.id === cardData.id)) {
                        selectedDeck.push(cardData);
                        alert(`${cardData.playerName} (レアリティ: ${cardData.rarity}) がデッキに追加されました。`);
                    } else {
                        alert('このカードはすでにデッキにあります！');
                    }
                } else {
                    alert('デッキはすでに5枚のカードでいっぱいです。カードを削除してから追加してください。');
                }
            }
            saveCards();
            renderDeckDisplay(); // Re-render deck display after change
        }

        function renderDeckDisplay() {
            deckDisplayArea.innerHTML = ''; // Clear current deck display
            if (selectedDeck.length === 0) {
                const placeholder = document.createElement('p');
                placeholder.style.color = '#aaa';
                placeholder.textContent = 'デッキにカードがありません。図鑑からカードをダブルクリックして追加してください。';
                deckDisplayArea.appendChild(placeholder);
            } else {
                selectedDeck.forEach(cardData => {
                    // Create a simplified card element for the deck view
                    const deckCardElement = createCardElement(cardData, undefined, true); // isDeckCard = true
                    deckDisplayArea.appendChild(deckCardElement);
                });
            }
            initSortable(); // Initialize SortableJS every time the deck is rendered
        }

        function renderEncyclopedia() {
            console.log('Rendering Encyclopedia...');
            let cardsUpdated = false;
            for (let i = 0; i < collectedCards.length; i++) {
                if (collectedCards[i].isNew) {
                    collectedCards[i].isNew = false;
                    cardsUpdated = true;
                }
            }

            if (cardsUpdated) {
                saveCards(); // Save updated collectedCards array to localStorage
            }

            encyclopediaContent.innerHTML = ''; // Clear previous content containers
            rarityTabsContainer.innerHTML = ''; // Clear previous tab buttons

            if (collectedCards.length === 0) {
                const noCardsMessage = document.createElement('p');
                noCardsMessage.textContent = 'まだカードがありません。パックを引いてみましょう！';
                noCardsMessage.style.color = '#ccc';
                encyclopediaContent.appendChild(noCardsMessage);
                return;
            }

            // Step 1: Sort all collected cards by rarity in descending order.
            const sortedCards = [...collectedCards].sort((a, b) => b.rarity - a.rarity);

            const cardsByRarityGroup = {};
            const rarityGroupOrder = [];

            for (const cardData of sortedCards) {
                const groupName = getRarityGroupName(cardData.rarity);
                if (!cardsByRarityGroup[groupName]) {
                    cardsByRarityGroup[groupName] = [];
                    rarityGroupOrder.push(groupName);
                }
                cardsByRarityGroup[groupName].push(cardData);
            }

            // Step 2: Sort rarity group names (tabs) by their minimum rarity value in descending order.
            rarityGroupOrder.sort((a, b) => {
                const getMinRarity = (name) => parseInt(name.match(/\\((\\d+)-/)[1]);
                return getMinRarity(b) - getMinRarity(a);
            });

            let firstTabButton = null;

            for (const groupName of rarityGroupOrder) {
                // Create tab button
                const tabButton = document.createElement('button');
                tabButton.textContent = groupName;
                tabButton.className = 'rarity-tab-button';
                tabButton.dataset.group = groupName;
                rarityTabsContainer.appendChild(tabButton);
                if (!firstTabButton) { firstTabButton = tabButton; }

                // Create content container for this rarity group
                const groupContainer = document.createElement('div');
                groupContainer.id = `rarity-group-${groupName.replace(/[^a-zA-Z0-9]/g, '-')}`;
                groupContainer.className = 'rarity-group-container';

                // Add a header inside the tab content for clarity
                const headerInTab = document.createElement('h4');
                headerInTab.className = 'rarity-group-header-in-tab';
                headerInTab.textContent = groupName + ' カード一覧';
                groupContainer.appendChild(headerInTab);

                const cardsWrapper = document.createElement('div');
                cardsWrapper.style.display = 'flex';
                cardsWrapper.style.flexWrap = 'wrap';
                cardsWrapper.style.justifyContent = 'center';
                cardsWrapper.style.gap = '20px';
                groupContainer.appendChild(cardsWrapper);

                for (const cardData of cardsByRarityGroup[groupName]) {
                    cardsWrapper.appendChild(createCardElement(cardData));
                }
                encyclopediaContent.appendChild(groupContainer);

                // Add event listener to tab button
                tabButton.addEventListener('click', () => {
                    console.log(`Tab button clicked: ${groupName}`);
                    // Deactivate all tab buttons and hide all group containers
                    document.querySelectorAll('.rarity-tab-button').forEach(btn => btn.classList.remove('active'));
                    document.querySelectorAll('.rarity-group-container').forEach(container => container.classList.remove('active'));

                    // Activate clicked tab button and show its corresponding group container
                    tabButton.classList.add('active');
                    groupContainer.classList.add('active');
                });
            }

            // Activate the first tab by default
            if (firstTabButton) {
                firstTabButton.click();
            }
        }

                for (let i = 0; i < numCards; i++) {
                    const cardSeed = baseSeed + i;

                    if (!existingCardInCollection) {

            encyclopediaArea.style.display = 'none';
